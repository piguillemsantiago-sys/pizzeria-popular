<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Config mínima de fontconfig para que sharp/libvips encuentre las
     tipografías de marca al componer piezas (lib/generador.js).
     Se activa con FONTCONFIG_FILE=/var/www/pizzeria-popular/fonts/fonts.conf
     en el .env del VPS. -->
<fontconfig>
  <dir>/var/www/pizzeria-popular/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
