<svg xmlns="http://www.w3.org/2000/svg" width="450" height="450" viewBox="0 0 450 450">
  <rect width="450" height="450" fill="#0d0d0d"/>
  <g stroke="#C5A572" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Pizza slice 1 (large) -->
    <g transform="translate(70 80) rotate(-18)" opacity="0.22">
      <path d="M0,0 L70,-34 L70,34 Z"/>
      <circle cx="28" cy="-10" r="3.5" fill="#C5A572"/>
      <circle cx="42" cy="6" r="3.5" fill="#C5A572"/>
      <circle cx="32" cy="18" r="2.8" fill="#C5A572"/>
      <circle cx="52" cy="-4" r="2.8" fill="#C5A572"/>
      <circle cx="48" cy="22" r="2.2" fill="#C5A572"/>
    </g>

    <!-- Flame -->
    <g transform="translate(230 55) rotate(10)" opacity="0.23">
      <path d="M0,0 Q-14,-22 0,-40 Q8,-26 14,-30 Q22,-16 11,0 Q5,8 0,0 Z"/>
      <path d="M0,-8 Q-5,-18 2,-28 Q5,-20 7,-22" stroke-width="1.8"/>
    </g>

    <!-- Wheat stalk -->
    <g transform="translate(370 70) rotate(-6)" opacity="0.24">
      <line x1="0" y1="0" x2="0" y2="80"/>
      <line x1="0" y1="10" x2="-11" y2="3"/><line x1="0" y1="10" x2="11" y2="3"/>
      <line x1="0" y1="24" x2="-11" y2="17"/><line x1="0" y1="24" x2="11" y2="17"/>
      <line x1="0" y1="38" x2="-11" y2="31"/><line x1="0" y1="38" x2="11" y2="31"/>
      <line x1="0" y1="52" x2="-10" y2="45"/><line x1="0" y1="52" x2="10" y2="45"/>
      <line x1="0" y1="66" x2="-8" y2="60"/><line x1="0" y1="66" x2="8" y2="60"/>
    </g>

    <!-- Wine glass -->
    <g transform="translate(90 200) rotate(6)" opacity="0.22">
      <path d="M-22,-32 Q-22,4 0,4 Q22,4 22,-32 Z"/>
      <line x1="0" y1="4" x2="0" y2="34"/>
      <line x1="-18" y1="36" x2="18" y2="36"/>
    </g>

    <!-- Tomato -->
    <g transform="translate(245 220)" opacity="0.23">
      <circle cx="0" cy="3" r="28"/>
      <path d="M-11,-25 L0,-32 L11,-25"/>
      <line x1="-7" y1="-28" x2="7" y2="-28"/>
      <path d="M0,-32 L0,-42"/>
      <path d="M-4,-36 Q-8,-40 -12,-38" stroke-width="1.8"/>
    </g>

    <!-- Garlic bulb -->
    <g transform="translate(380 240) rotate(-8)" opacity="0.22">
      <path d="M-20,8 Q-23,-24 0,-30 Q23,-24 20,8 Q13,26 0,26 Q-13,26 -20,8 Z"/>
      <line x1="0" y1="-30" x2="0" y2="-42"/>
      <path d="M-10,-10 Q-6,16 0,24 M10,-10 Q6,16 0,24" stroke-width="1.8"/>
    </g>

    <!-- Rolling pin -->
    <g transform="translate(80 360) rotate(22)" opacity="0.23">
      <rect x="-48" y="-13" width="96" height="26" rx="10"/>
      <line x1="-62" y1="0" x2="-48" y2="0"/>
      <line x1="48" y1="0" x2="62" y2="0"/>
      <circle cx="-62" cy="0" r="3"/>
      <circle cx="62" cy="0" r="3"/>
    </g>

    <!-- Fork & knife crossed -->
    <g transform="translate(230 360) rotate(-8)" opacity="0.22">
      <g transform="rotate(-20)">
        <line x1="0" y1="-42" x2="0" y2="38"/>
        <line x1="-8" y1="-42" x2="-8" y2="-20"/>
        <line x1="8" y1="-42" x2="8" y2="-20"/>
        <line x1="-8" y1="-20" x2="8" y2="-20"/>
      </g>
      <g transform="rotate(20)">
        <line x1="0" y1="-8" x2="0" y2="38"/>
        <path d="M-6,-42 Q0,-46 6,-42 L6,-8 L-6,-8 Z"/>
      </g>
    </g>

    <!-- Pizza slice 2 -->
    <g transform="translate(380 380) rotate(30)" opacity="0.20">
      <path d="M0,0 L62,-30 L62,30 Z"/>
      <circle cx="28" cy="0" r="3" fill="#C5A572"/>
      <circle cx="42" cy="-12" r="2.5" fill="#C5A572"/>
      <circle cx="42" cy="12" r="2.5" fill="#C5A572"/>
    </g>

    <!-- Flame 2 -->
    <g transform="translate(160 140) rotate(-18)" opacity="0.21">
      <path d="M0,0 Q-11,-18 0,-32 Q6,-22 11,-26 Q17,-14 8,0 Q4,6 0,0 Z"/>
    </g>

    <!-- Wheat 2 -->
    <g transform="translate(150 285) rotate(18)" opacity="0.22">
      <line x1="0" y1="0" x2="0" y2="62"/>
      <line x1="0" y1="8" x2="-9" y2="3"/><line x1="0" y1="8" x2="9" y2="3"/>
      <line x1="0" y1="22" x2="-9" y2="17"/><line x1="0" y1="22" x2="9" y2="17"/>
      <line x1="0" y1="36" x2="-9" y2="31"/><line x1="0" y1="36" x2="9" y2="31"/>
      <line x1="0" y1="50" x2="-8" y2="45"/><line x1="0" y1="50" x2="8" y2="45"/>
    </g>

    <!-- Wine glass 2 -->
    <g transform="translate(310 120) rotate(-12)" opacity="0.19">
      <path d="M-17,-26 Q-17,4 0,4 Q17,4 17,-26 Z"/>
      <line x1="0" y1="4" x2="0" y2="28"/>
      <line x1="-14" y1="30" x2="14" y2="30"/>
    </g>

    <!-- Tomato 2 (small) -->
    <g transform="translate(115 260)" opacity="0.20">
      <circle cx="0" cy="2" r="16"/>
      <path d="M-6,-14 L0,-18 L6,-14"/>
      <line x1="-4" y1="-16" x2="4" y2="-16"/>
    </g>

    <!-- Garlic 2 (small) -->
    <g transform="translate(300 300) rotate(12)" opacity="0.19">
      <path d="M-13,6 Q-15,-16 0,-20 Q15,-16 13,6 Q9,18 0,18 Q-9,18 -13,6 Z"/>
      <line x1="0" y1="-20" x2="0" y2="-28"/>
    </g>

  </g>
</svg>
