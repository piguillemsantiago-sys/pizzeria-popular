<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <!-- Capa base: marrón oscuro cálido -->
  <rect width="560" height="560" fill="#1a0f0d"/>

  <!-- Capa 1: watermark "P" de Pizzería Popular, disperso y rotado -->
  <g fill="#C5A572" opacity="0.13" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="40" y="205" font-size="150" transform="rotate(-8 95 160)">P</text>
    <text x="395" y="150" font-size="100" transform="rotate(13 420 120)">P</text>
    <text x="295" y="430" font-size="155" transform="rotate(-6 350 380)">P</text>
    <text x="105" y="525" font-size="92" transform="rotate(16 130 495)">P</text>
  </g>

  <!-- Capa 2: doodles iconográficos argentino-italiano-festivos, line-art -->
  <g stroke="#C5A572" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     opacity="0.16" vector-effect="non-scaling-stroke">
    <!-- llama estilizada -->
    <g transform="translate(250,58) scale(1.1)">
      <path d="M18 2 C24 10 30 18 26 28 C23 35 11 36 9 28 C7 22 13 19 13 13 C16 17 21 15 18 9 C17 6 17 4 18 2 Z"/>
      <path d="M18 16 C21 20 22 25 18 29 C15 26 14 22 16 18 Z"/>
    </g>
    <!-- porción de pizza, punta arriba -->
    <g transform="translate(455,225) scale(1.2)">
      <path d="M20 3 L7 31 Q20 38 33 31 Z"/>
      <circle cx="16" cy="20" r="2.3"/>
      <circle cx="25" cy="24" r="2.3"/>
      <circle cx="20" cy="30" r="2.3"/>
    </g>
    <!-- espiga de trigo -->
    <g transform="translate(34,318) scale(1.05)">
      <path d="M20 39 L20 5"/>
      <path d="M20 5 L17 9 M20 5 L23 9"/>
      <path d="M20 9 L14 13 M20 9 L26 13 M20 16 L13 21 M20 16 L27 21 M20 23 L13 28 M20 23 L27 28 M20 30 L15 34 M20 30 L25 34"/>
    </g>
    <!-- tomate -->
    <g transform="translate(246,252) scale(0.95)">
      <circle cx="20" cy="23" r="13"/>
      <path d="M20 10 L20 4 M20 6 L14 4 M20 6 L26 4"/>
    </g>
    <!-- hoja de albahaca -->
    <g transform="translate(465,395) scale(1.1)">
      <path d="M20 4 C31 12 31 27 20 36 C9 27 9 12 20 4 Z"/>
      <path d="M20 7 L20 33 M20 14 L14 12 M20 14 L26 12 M20 22 L13 20 M20 22 L27 20"/>
    </g>
    <!-- copa de vino -->
    <g transform="translate(150,372) scale(1.05)">
      <path d="M11 5 C11 18 29 18 29 5 Z"/>
      <path d="M20 18 L20 33 M12 35 L28 35"/>
    </g>
    <!-- jarra de cerveza -->
    <g transform="translate(375,488) scale(1.1)">
      <path d="M9 11 L9 36 L27 36 L27 11 Z"/>
      <path d="M27 16 C36 18 36 30 27 31"/>
      <path d="M9 11 C12 6 16 9 19 6 C22 9 25 7 27 11"/>
    </g>
  </g>
</svg>
