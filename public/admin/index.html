<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel · Pizzería Popular</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin-app">

  <header class="admin-header">
    <div class="admin-brand">Pizzería <span>Popular</span> · Panel</div>
    <div class="admin-user">
      <span id="adminEmail"></span>
      <button id="logoutBtn">Salir</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-loading" id="loading">Cargando…</div>

    <section class="admin-panel" id="panel" hidden>
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="promos">Promociones</button>
        <button class="admin-tab" data-tab="blog">Blog</button>
      </div>

      <!-- Vista Promociones -->
      <div class="tab-view" id="view-promos">
        <div class="panel-head">
          <h1>Promociones</h1>
          <button class="btn-primary" id="newPromoBtn">+ Nueva promo</button>
        </div>

        <div class="assistant">
          <div class="assistant-head">🤖 Asistente IA <span>pedí cambios en lenguaje natural</span></div>
          <div class="assistant-log" id="assistantLog">
            <div class="as-msg as-bot">Hola 👋 Decime qué querés cambiar en las promociones. Por ejemplo: "ocultá el Happy Hour y creá un 2×1 en pizzas los jueves".</div>
          </div>
          <form class="assistant-form" id="assistantForm">
            <input type="text" id="assistantInput" placeholder="Escribí una instrucción…" autocomplete="off" />
            <button type="submit" class="btn-primary" id="assistantSend">Enviar</button>
          </form>
        </div>

        <div class="promo-list" id="promoList"></div>
      </div>

      <!-- Vista Blog -->
      <div class="tab-view" id="view-blog" hidden>
        <div class="panel-head">
          <h1>Blog</h1>
          <button class="btn-primary" id="newPostBtn">+ Nuevo post</button>
        </div>
        <div class="promo-list" id="postList"></div>
      </div>
    </section>
  </main>

  <!-- Modal crear/editar promo -->
  <div class="modal-overlay" id="modal" hidden>
    <div class="modal">
      <h2 id="modalTitle">Nueva promo</h2>
      <form id="promoForm">
        <label>Título *
          <input type="text" name="titulo" required />
        </label>
        <label>Subtítulo
          <input type="text" name="subtitulo" placeholder="Ej. Todos los lunes" />
        </label>
        <label>Descripción
          <textarea name="descripcion"></textarea>
        </label>
        <label>Condiciones / letra chica
          <textarea name="condiciones"></textarea>
        </label>
        <div class="row2">
          <label>Badge
            <input type="text" name="badge" placeholder="Ej. Promo (vacío = sin badge)" />
          </label>
          <label>Imagen (ruta o URL)
            <input type="text" name="imagen_url" placeholder="/images/..." />
          </label>
        </div>
        <div class="row2">
          <label>Texto del botón
            <input type="text" name="boton_texto" placeholder="Reservar mesa" />
          </label>
          <label>Acción del botón
            <select name="boton_accion">
              <option value="reservar">Reservar mesa</option>
              <option value="menus">Ver menús</option>
              <option value="ninguno">Sin botón</option>
            </select>
          </label>
        </div>
        <div class="row2">
          <label>Idioma
            <select name="idioma">
              <option value="es">Español</option>
              <option value="en">Inglés</option>
            </select>
          </label>
          <label>Orden
            <input type="number" name="orden" value="0" />
          </label>
        </div>
        <label class="check">
          <input type="checkbox" name="activa" checked /> Promo activa (visible en la web)
        </label>
        <p class="modal-error" id="modalError"></p>
        <div class="modal-actions">
          <button type="button" id="cancelBtn">Cancelar</button>
          <button type="submit" class="save" id="saveBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal crear/editar post -->
  <div class="modal-overlay" id="postModal" hidden>
    <div class="modal">
      <h2 id="postModalTitle">Nuevo post</h2>
      <form id="postForm">
        <label>Título *
          <input type="text" name="titulo" required />
        </label>
        <div class="row2">
          <label>Slug * (kebab-case, sin acentos)
            <input type="text" name="slug" required placeholder="mi-post-nuevo" />
          </label>
          <label>Idioma
            <select name="idioma">
              <option value="es">Español</option>
              <option value="en">Inglés</option>
            </select>
          </label>
        </div>
        <label>Eyebrow (etiqueta sobre el título)
          <input type="text" name="eyebrow" placeholder="Novedades" />
        </label>
        <label>Subtítulo (bajada del hero)
          <input type="text" name="subtitulo" />
        </label>
        <div class="row2">
          <label>Fecha
            <input type="date" name="fecha" />
          </label>
          <label>Estado
            <select name="estado">
              <option value="preparacion">En preparación</option>
              <option value="pendiente">Pendiente de publicar</option>
              <option value="publicado">Publicado</option>
            </select>
          </label>
        </div>
        <label>Imagen del hero (ruta o URL)
          <input type="text" name="hero_image" placeholder="/images/blog/..." />
        </label>
        <label>Meta description (SEO)
          <textarea name="meta_desc"></textarea>
        </label>
        <label>Keyword objetivo
          <input type="text" name="keyword" />
        </label>
        <label>Contenido — HTML del cuerpo (lo genera la IA; editable a mano)
          <textarea name="contenido" class="code"></textarea>
        </label>
        <p class="modal-error" id="postModalError"></p>
        <div class="modal-actions">
          <button type="button" id="postCancelBtn">Cancelar</button>
          <button type="submit" class="save" id="postSaveBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
